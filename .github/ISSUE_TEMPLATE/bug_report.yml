name: Bug report
description: Report a reproducible problem with ForgeGuard
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues before opening a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ForgeGuard version
      description: Output of `forgeguard --version`.
      placeholder: forgeguard 0.10.0
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent or host
      description: Select the environment where ForgeGuard was running.
      options:
        - Codex
        - Claude Code
        - Cursor
        - OpenCode
        - Hermes
        - OpenClaw
        - Antigravity
        - AGENTS.md-compatible agent
        - CLI only
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Include the smallest useful compact output. Remove secrets and personal information before posting.
      render: shell
  - type: textarea
    id: repository
    attributes:
      label: Minimal reproduction
      description: Link a minimal repository or paste the smallest sanitized files/configuration that reproduce the problem.
