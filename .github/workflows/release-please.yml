name: release-please

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['crates/forgeguard-cli--release_created'] }}
      tag_name: ${{ steps.release.outputs['crates/forgeguard-cli--tag_name'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT rather than github.token: pull requests opened with GITHUB_TOKEN do not
          # trigger workflow events, so CI never ran on the release pull request itself.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # The tap and bucket jobs need TAP_PUBLISH_TOKEN; a called workflow gets no secrets
    # unless the caller passes them.
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  npm-publish:
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
