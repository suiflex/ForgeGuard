name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/forgeguard-cli/Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - uses: dtolnay/rust-toolchain@788abdaa468b02b2d53a3d1d8fcac62dc9858f4a # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo deny check
      - run: cargo audit --deny warnings
      - run: sh -n install.sh
      - run: sh tests/install_test.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  build:
    needs: verify
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: forgeguard-linux-x86_64.tar.gz
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: forgeguard-linux-aarch64.tar.gz
            archive: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: forgeguard-macos-x86_64.tar.gz
            archive: tar
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: forgeguard-macos-aarch64.tar.gz
            archive: tar
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: forgeguard-windows-x86_64.zip
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: forgeguard-windows-aarch64.zip
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@788abdaa468b02b2d53a3d1d8fcac62dc9858f4a # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/forgeguard" dist/package/forgeguard
          tar -C dist/package -czf "dist/${{ matrix.asset }}" forgeguard
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          fi
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/forgeguard.exe" dist/package/forgeguard.exe
          Compress-Archive -Path dist/package/forgeguard.exe -DestinationPath "dist/${{ matrix.asset }}"
          (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.asset }}").Hash.ToLowerInvariant() |
            Set-Content -NoNewline "dist/${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/*
