name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Git tag to build and publish (e.g. v0.11.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish (e.g. v0.11.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/forgeguard-cli/Cargo.toml | head -1)"
          test "${tag#v}" = "$package_version"
      - uses: dtolnay/rust-toolchain@788abdaa468b02b2d53a3d1d8fcac62dc9858f4a # stable
        with:
          components: rustfmt, clippy
      - name: Sync Cargo.lock to this release's version
        shell: bash
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          cargo update -p forgeguard --precise "${version#v}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo deny check
      - run: cargo audit --deny warnings
      - run: sh -n install.sh
      - run: sh tests/install_test.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  build:
    needs: verify
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: forgeguard-linux-x86_64.tar.gz
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: forgeguard-linux-aarch64.tar.gz
            archive: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: forgeguard-macos-x86_64.tar.gz
            archive: tar
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: forgeguard-macos-aarch64.tar.gz
            archive: tar
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: forgeguard-windows-x86_64.zip
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: forgeguard-windows-aarch64.zip
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@788abdaa468b02b2d53a3d1d8fcac62dc9858f4a # stable
        with:
          targets: ${{ matrix.target }}
      - name: Sync Cargo.lock to this release's version
        shell: bash
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          cargo update -p forgeguard --precise "${version#v}"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/forgeguard" dist/package/forgeguard
          tar -C dist/package -czf "dist/${{ matrix.asset }}" forgeguard
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          fi
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/forgeguard.exe" dist/package/forgeguard.exe
          Compress-Archive -Path dist/package/forgeguard.exe -DestinationPath "dist/${{ matrix.asset }}"
          (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.asset }}").Hash.ToLowerInvariant() |
            Set-Content -NoNewline "dist/${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*

  # Distribution channels: siblings of each other, both gated on `publish`. Neither needs
  # the other, so a tap failure does not cancel the bucket push or vice versa.
  #
  # Checksums come from this run's artifacts rather than from `gh release download`: they
  # are already built and hashed here, so there is nothing to re-fetch and no race against
  # release-asset propagation. The build jobs write the bare hex digest with no file name,
  # so the value is read directly.

  publish-homebrew:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Render the formula and push it to the tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sha() { tr -d '[:space:]' < "dist/forgeguard-$1.tar.gz.sha256"; }

          sed -e "s|@VERSION@|${version}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@MAC_ARM_SHA@|$(sha macos-aarch64)|g" \
              -e "s|@MAC_X64_SHA@|$(sha macos-x86_64)|g" \
              -e "s|@LINUX_ARM_SHA@|$(sha linux-aarch64)|g" \
              -e "s|@LINUX_X64_SHA@|$(sha linux-x86_64)|g" \
              packaging/forgeguard.rb.tmpl > forgeguard.rb
          # A surviving placeholder means an artifact was missing. Fail here rather than
          # publishing a formula that cannot install.
          ! grep -q '@[A-Z_]*@' forgeguard.rb

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv forgeguard.rb tap/Formula/forgeguard.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/forgeguard.rb
          git commit -m "forgeguard ${version}" || { echo "tap already up to date"; exit 0; }
          git push

  publish-scoop:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Render the manifest and push it to the bucket
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sha() { tr -d '[:space:]' < "dist/forgeguard-$1.zip.sha256"; }

          sed -e "s|@VERSION@|${version}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@WIN_X64_SHA@|$(sha windows-x86_64)|g" \
              -e "s|@WIN_ARM64_SHA@|$(sha windows-aarch64)|g" \
              packaging/forgeguard.json.tmpl > forgeguard.json
          ! grep -q '@[A-Z_]*@' forgeguard.json
          jq empty forgeguard.json

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          mv forgeguard.json bucket/bucket/forgeguard.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/forgeguard.json
          git commit -m "forgeguard ${version}" || { echo "bucket already up to date"; exit 0; }
          git push
