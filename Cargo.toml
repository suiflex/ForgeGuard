[workspace]
members = [
  "crates/forgeguard-core",
  "crates/forgeguard-cli",
]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
authors = ["SuiFlex"]
repository = "https://github.com/suiflex/ForgeGuard"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
inquire = "0.9"
kurir = "0.4"
regex = "1.10"
# `bundled` compiles SQLite into the binary: no system library, no runtime service.
rusqlite = { version = "0.40", features = ["bundled"] }
rmcp = { version = "3.3", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt"] }
toml = "1.1"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-erlang = "0.21.0"
tree-sitter-go = "0.25.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.24.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-julia = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.26.0"
tree-sitter-perl = "1.1.2"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.0"
tree-sitter-solidity = "1.2.13"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-swift = "0.7.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-verilog = "1.0.3"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
# Compresses the committed graph artifact; bundles the C library like rusqlite does.
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
