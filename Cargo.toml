[workspace]
members = [
  "crates/forgeguard-core",
  "crates/forgeguard-cli",
]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
authors = ["SuiFlex"]
repository = "https://github.com/suiflex/ForgeGuard"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
inquire = "0.9"
# Pinned until kurir 0.2.0 is published; switch to `kurir = "0.2"` then.
kurir = { version = "0.1.0", git = "https://github.com/suiflex/kurir", rev = "aa70c4113b05656f424bfd9f335276e80a3223dd" }
regex = "1.10"
rmcp = { version = "3.3", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt"] }
toml = "1.1"
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-erlang = "0.20.0"
tree-sitter-go = "0.25.0"
tree-sitter-hcl = "1.1.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.0"
tree-sitter-solidity = "1.2.13"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
