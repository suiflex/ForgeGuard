[workspace]
members = [
  "crates/forgeguard-core",
  "crates/forgeguard-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["SuiFlex"]
repository = "https://github.com/suiflex/ForgeGuard"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
