version = 1
mode = "guard"

[project]
name = "example-project"

[scan]
enabled = true
max_file_bytes = 1000000
include_tests = false
extra_excludes = ["generated/"]
duplicate_block_lines = 6

[[commands]]
name = "format"
command = "cargo fmt --all -- --check"
required = true
enabled = true
timeout_seconds = 600

[[commands]]
name = "lint"
command = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
required = true
enabled = true
timeout_seconds = 600

[[commands]]
name = "test"
command = "cargo test --workspace"
required = true
enabled = true
timeout_seconds = 600
